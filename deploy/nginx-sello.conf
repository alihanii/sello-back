# The server's nginx in front of Sello: /api and /media go to the backend, everything else to the frontend.
# Install: cp nginx-sello.conf /etc/nginx/sites-available/sello && ln -s ../sites-available/sello /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# Without a domain it serves http://SERVER_IP:8200. With a domain: set server_name, use "listen 80;",
# then run: certbot --nginx -d your.domain
server {
    listen 8200;
    server_name _;

    client_max_body_size 50m;

    location ~ ^/(api|media)/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live operation updates use Server-Sent Events
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Store websites (sello-public-store): every host that isn't the panel goes to the storefront on 127.0.0.1:3200.
# It serves <subdomain>.ROOT_DOMAIN (wildcard DNS *.ROOT_DOMAIN → this server) and sellers' own domains.
# Install: cp nginx-store.conf /etc/nginx/sites-available/sello-store && ln -s ../sites-available/sello-store /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# HTTPS:
#  - our subdomains: one wildcard certificate, e.g. certbot certonly --manual --preferred-challenges dns -d '*.ROOT_DOMAIN'
#    (or a DNS plugin of your DNS provider), then uncomment the 443 server below.
#  - sellers' own domains: per domain, certbot --nginx -d shop.example.ir -d www.shop.example.ir once its DNS points here.
#    (For many domains, Caddy with on_demand_tls and `ask http://127.0.0.1:8100/api/v1/public/sites/tls-check` does this
#    automatically.)
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP challenges for sellers' own domains.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}


# test + build: on every pull request and push to main (a failure stops here).
# deploy: on push to main only, copy the built image to the server over SSH and restart.
# The server doesn't build anything or pull from a registry, so it works on servers with limited internet.
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, optional SSH_PORT (default 22).
# Repository variable (optional): DEPLOY_PATH (default /opt/sello).
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || 'deploy-server' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sello' }}
  BASE_IMAGES: postgres:16-alpine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sello-back:latest .

      - name: Save image
        if: github.event_name != 'pull_request'
        run: docker save sello-back:latest | gzip -1 > sello-back.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sello-back-image
          path: sello-back.tar.gz
          retention-days: 3
          compression-level: 0

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sello-back-image

      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config
          ssh server "mkdir -p '$DEPLOY_PATH' && docker version --format 'docker {{.Server.Version}}'"

      - name: Ship base images the server doesn't have yet
        run: |
          missing=$(ssh server "for i in $BASE_IMAGES; do docker image inspect \$i >/dev/null 2>&1 || echo \$i; done")
          if [ -n "$missing" ]; then
            echo "Shipping: $missing"
            for i in $missing; do docker pull "$i"; done
            docker save $missing | gzip -1 | ssh server "gunzip | docker load"
          fi

      - name: Copy files and restart
        run: |
          scp deploy/docker-compose.yml deploy/nginx-sello.conf deploy/nginx-store.conf deploy/env.example sello-back.tar.gz "server:$DEPLOY_PATH/"
          ssh server "set -e; cd '$DEPLOY_PATH'
            test -f .env || { echo '::error::$DEPLOY_PATH/.env is missing: copy env.example to .env and fill it in'; exit 1; }
            gunzip -c sello-back.tar.gz | docker load && rm sello-back.tar.gz
            svcs='db backend'
            docker image inspect sello-front:latest >/dev/null 2>&1 && svcs=\"\$svcs frontend\" || echo 'sello-front not deployed yet: run its deploy workflow'
            docker image inspect sello-store:latest >/dev/null 2>&1 && svcs=\"\$svcs store\" || echo 'sello-public-store not deployed yet: run its deploy workflow'
            docker compose up -d --remove-orphans \$svcs
            docker image prune -f >/dev/null || true  # the other repo's deploy may be pruning at the same time
            for i in \$(seq 1 30); do docker compose exec -T backend python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\" 2>/dev/null && { echo backend healthy; exit 0; }; sleep 2; done
            docker compose logs --tail 80 backend; exit 1"
